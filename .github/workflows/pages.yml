name: Windjammer Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Releases published with GITHUB_TOKEN do not start release-triggered workflows.
  workflow_run:
    workflows: [Windjammer firmware]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Skipped firmware runs must not replace a pending Pages deployment.
  group: >-
    ${{ github.event_name == 'workflow_run' &&
        (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push' ||
         !startsWith(github.event.workflow_run.head_branch, 'v') ||
         github.event.workflow_run.head_repository.full_name != github.repository) &&
        format('windjammer-pages-skipped-{0}', github.run_id) || format('windjammer-pages-{0}', github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # For workflow_run, github.sha is the default branch commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Download and verify published firmware
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9._-]{0,14}$ ]]; then
            echo "Latest release has an unsupported tag: $tag" >&2
            exit 1
          fi
          asset="Windjammer-FM-1-$tag.fwsc"
          release_dir=$(mktemp -d "$RUNNER_TEMP/windjammer-release.XXXXXX")
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern SHA256SUMS --dir "$release_dir"
          (
            cd "$release_dir"
            checksum=$(awk -v asset="$asset" '$2 == asset { print }' SHA256SUMS)
            if [[ ! "$checksum" =~ ^[0-9a-f]{64}"  $asset"$ ]]; then
              echo "Expected one SHA-256 checksum for $asset" >&2
              exit 1
            fi
            printf '%s\n' "$checksum" | sha256sum --check --strict -
          )
          printf 'tag=%s\nfirmware=%s/%s\n' "$tag" "$release_dir" "$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install hash-locked font dependencies
        run: python3 -m pip install --require-hashes --only-binary=":all:" -r tools/ci/requirements.txt
      - name: Install pinned official Emscripten SDK
        env:
          EMSDK_COMMIT: c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
        run: |
          sdk="$RUNNER_TEMP/emsdk"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/emscripten-core/emsdk.git "$EMSDK_COMMIT"
          git -C "$sdk" checkout --detach "$EMSDK_COMMIT"
          test "$(git -C "$sdk" rev-parse HEAD)" = "$EMSDK_COMMIT"
          "$sdk/emsdk" install 4.0.23
          "$sdk/emsdk" activate 4.0.23
      - name: Build browser converter and emulator
        env:
          EMU_VERSION: ${{ steps.release.outputs.tag }}
          EMU_PREVIEW: '0'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 -c 'from tools.build import generate; generate()'
          sh web/conv/build.sh
          sh web/emu/build.sh
      - name: Build and verify Pages output
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_FIRMWARE: ${{ steps.release.outputs.firmware }}
        run: |
          site="$RUNNER_TEMP/windjammer-pages"
          python3 - "$RELEASE_FIRMWARE" "$RELEASE_TAG" "$site" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          from tools.fm1_install import files_ok, load_package

          firmware, tag, site = sys.argv[1:]
          package = Path(firmware)
          product, image = load_package(package, force=False)
          if product != "FM-1_700" or not files_ok(image):
              raise SystemExit(f"{package.name}: expected a valid FM-1_700 package, found {product}")

          subprocess.run([sys.executable, "web/make_site.py", firmware, tag, site], check=True)
          raw = package.read_bytes()
          published = Path(site) / "firmware"
          manifest = json.loads((published / "manifest.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(raw).hexdigest()
          expected = {"version": tag, "product": product, "pkg": package.name, "sha256": digest}
          if manifest != expected or (published / package.name).read_bytes() != raw:
              raise SystemExit("Published firmware or manifest differs from the verified release")
          if (published / "SHA256SUMS").read_text(encoding="utf-8") != f"{digest}  {package.name}\n":
              raise SystemExit("Published checksum differs from the verified release")
          PY
          node web/test_backup.mjs
          node web/test_web.mjs
          node web/test_web.mjs --site "$site"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/windjammer-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
