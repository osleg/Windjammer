name: Windjammer firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install hash-locked font dependencies
        run: python3 -m pip install --require-hashes --only-binary=":all:" -r tools/ci/requirements.txt
      - name: Fetch verified toolchain and SDK inputs
        run: tools/ci/get_dependencies.sh "$RUNNER_TEMP/windjammer-deps"
      - name: Build and validate FM-1 controller firmware
        env:
          WINDJAMMER_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: tools/ci/build_cafa.sh
      - name: Preserve firmware diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windjammer-fm1-${{ github.sha }}
          path: build/ci/windjammer/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Stage validated release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          output="$PWD/build/ci/windjammer"
          release="$RUNNER_TEMP/windjammer-release"
          name="Windjammer-FM-1-${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
          mkdir -p "$release"
          cp "$output/Windjammer-FM-1.fwsc" "$release/$name.fwsc"
          (
            cd "$output"
            python3 -m zipfile -c "$release/$name-licenses.zip" \
              LICENSE LICENSING.md LICENSES SOURCE.txt source-attributions
          )
          (
            cd "$release"
            sha256sum "$name.fwsc" "$name-licenses.zip" > SHA256SUMS
          )
      - name: Upload validated release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windjammer-release-assets
          path: ${{ runner.temp }}/windjammer-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windjammer-release-assets
          path: ${{ runner.temp }}/windjammer-release/
      - name: Verify release checksums
        working-directory: ${{ runner.temp }}/windjammer-release/
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish firmware prerelease
        working-directory: ${{ runner.temp }}/windjammer-release/
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            printf 'Windjammer controller firmware for the M-VAVE FM-1. A compatible companion app is required.\n\n'
            printf 'The firmware reports device identity `FM-1_700`. This prerelease passed automated firmware checks. Physical-device acceptance is pending.\n\n'
            printf 'The release includes SHA-256 checksums and a license archive.\n\n'
            printf 'Corresponding source: [%s](%s).\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          } > "$RUNNER_TEMP/windjammer-release-notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Windjammer $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/windjammer-release-notes.md" \
            ./*.fwsc SHA256SUMS ./*-licenses.zip
