name: CAFA v5 companion

on:
  push:
    branches: ['cafa/**']
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/cafa-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafa-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install hash-locked font dependencies
        run: python3 -m pip install --require-hashes --only-binary=":all:" -r tools/ci/requirements.txt
      - name: Fetch verified toolchain and official SDK inputs
        run: tools/ci/get_dependencies.sh "$RUNNER_TEMP/skiff-deps"
      - name: Build sample-light companion and check budgets, protocol and USB
        run: tools/ci/build_cafa.sh
      - name: Preserve experimental firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skiff-cafa-v5-${{ github.sha }}
          path: build/ci/cafa/
          if-no-files-found: error
          retention-days: 14
