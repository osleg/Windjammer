name: Firmware bug
description: Report a reproducible Windjammer firmware or controller issue.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Windjammer build
      description: Enter the release tag or source commit, and the installed companion app version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include what you expected, what happened, and the audio route if relevant.
    validations:
      required: true
